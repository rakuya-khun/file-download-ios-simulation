customHeaders:
  - pattern: '/v3/verification/qr.json'
    headers:
      - key: 'Content-Type'
        value: 'application/json; charset=utf-8'
      - key: 'Content-Disposition'
        value: 'attachment; filename="verification-qr.json"'
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/v3/verification/qr.pdf'
    headers:
      - key: 'Content-Type'
        value: 'application/pdf'
      - key: 'Content-Disposition'
        value: 'attachment; filename="verification-qr.pdf"'
      - key: 'Cache-Control'
        value: 'no-store'
