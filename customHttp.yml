customHeaders:
  - pattern: '/v3/verification/qr.json'
    headers:
      - key: 'Content-Type'
        value: 'application/json; charset=utf-8'
      - key: 'Content-Disposition'
        value: 'attachment; filename="verification-qr.json"'
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/v3/verification/qr.pdf'
    headers:
      - key: 'Content-Type'
        value: 'application/pdf'
      - key: 'Content-Disposition'
        value: 'attachment; filename="verification-qr.pdf"'
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/v3/verification/qr.csv'
    headers:
      - key: 'Content-Type'
        value: 'text/csv; charset=utf-8'
      - key: 'Content-Disposition'
        value: 'attachment; filename="verification-qr.csv"'
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/v3/verification/qr.txt'
    headers:
      - key: 'Content-Type'
        value: 'text/plain; charset=utf-8'
      - key: 'Content-Disposition'
        value: 'attachment; filename="verification-qr.txt"'
      - key: 'Cache-Control'
        value: 'no-store'
