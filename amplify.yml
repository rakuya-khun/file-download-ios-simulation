version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10
        - node --version
        - pnpm --version
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run typecheck
        - pnpm run lint
        - pnpm run test
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
